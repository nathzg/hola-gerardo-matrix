<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020704" />
  <meta name="description" content="Un saludo desde la Matrix para Gerardo." />
  <title>Hola Gerardo</title>
  <style>
    :root {
      color-scheme: dark;
      --mx: 0;
      --my: 0;
      --green: #4dff8c;
      --green-hot: #b8ffd0;
      --ink: #020704;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--ink);
      color: #eafff1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      cursor: crosshair;
    }
    #matrix, .scanlines, .vignette, .pointer-glow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #matrix { z-index: 0; opacity: .78; }
    .scanlines {
      z-index: 2;
      opacity: .18;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .55) 4px);
      mix-blend-mode: multiply;
    }
    .vignette {
      z-index: 3;
      background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, .24) 66%, rgba(0, 0, 0, .9) 110%);
    }
    .pointer-glow {
      z-index: 1;
      background: radial-gradient(420px circle at var(--px, 50%) var(--py, 50%), rgba(40, 255, 112, .15), transparent 65%);
      transition: opacity .35s ease;
    }
    main {
      position: relative;
      z-index: 4;
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      perspective: 1100px;
    }
    .terminal {
      position: relative;
      width: min(760px, 92vw);
      padding: clamp(30px, 7vw, 70px) clamp(24px, 7vw, 72px);
      border: 1px solid rgba(79, 255, 140, .5);
      border-radius: 3px;
      background: linear-gradient(145deg, rgba(0, 17, 8, .86), rgba(0, 7, 4, .68));
      box-shadow: 0 0 0 1px rgba(0, 255, 85, .08) inset, 0 0 35px rgba(0, 255, 85, .14), 0 28px 90px rgba(0, 0, 0, .72);
      backdrop-filter: blur(7px) saturate(120%);
      transform: rotateX(calc(var(--my) * -4deg)) rotateY(calc(var(--mx) * 6deg)) translate3d(calc(var(--mx) * 16px), calc(var(--my) * 12px), 0);
      transform-style: preserve-3d;
      transition: transform 120ms ease-out, border-color .3s ease;
      will-change: transform;
    }
    .terminal::before, .terminal::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--green);
      opacity: .9;
    }
    .terminal::before { left: -7px; top: -7px; border-left: 2px solid; border-top: 2px solid; }
    .terminal::after { right: -7px; bottom: -7px; border-right: 2px solid; border-bottom: 2px solid; }
    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 34px;
      color: rgba(160, 255, 192, .66);
      font-size: clamp(.68rem, 1.5vw, .78rem);
      letter-spacing: .18em;
      text-transform: uppercase;
      transform: translateZ(26px) translate(calc(var(--mx) * -5px), calc(var(--my) * -5px));
    }
    .status i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 2.4s ease-in-out infinite;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 6.7rem);
      line-height: .95;
      letter-spacing: -.075em;
      font-weight: 700;
      color: var(--green-hot);
      text-shadow: 0 0 8px rgba(92, 255, 145, .78), 0 0 34px rgba(0, 255, 89, .3);
      transform: translateZ(72px) translate(calc(var(--mx) * 5px), calc(var(--my) * 4px));
      animation: flicker 7s linear infinite;
    }
    h1 span { display: block; color: var(--green); }
    .question {
      margin: 23px 0 0;
      color: rgba(222, 255, 233, .82);
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      letter-spacing: .02em;
      transform: translateZ(46px) translate(calc(var(--mx) * 2px), calc(var(--my) * 2px));
    }
    .question::before { content: "> "; color: var(--green); text-shadow: 0 0 10px var(--green); }
    .caret {
      display: inline-block;
      width: .65em;
      height: 1em;
      margin-left: .25em;
      vertical-align: -.13em;
      background: var(--green);
      box-shadow: 0 0 10px rgba(66, 255, 126, .7);
      animation: blink 1.1s steps(1) infinite;
    }
    .coordinates {
      position: fixed;
      z-index: 4;
      right: 18px;
      bottom: 15px;
      color: rgba(102, 255, 152, .45);
      font-size: .67rem;
      letter-spacing: .08em;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
    @keyframes flicker { 0%, 18%, 20%, 62%, 64%, 100% { opacity: 1; } 19%, 63% { opacity: .86; } }
    @media (max-width: 540px) {
      .terminal { padding-block: 44px; }
      .status { margin-bottom: 25px; }
      .coordinates { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .terminal, .status, h1, .question { transform: none; transition: none; animation: none; }
      .caret { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="pointer-glow" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <section class="terminal" aria-label="Mensaje para Gerardo">
      <div class="status"><i></i> conexión establecida</div>
      <h1>Hola<span>Gerardo</span></h1>
      <p class="question">¿Cómo estás?<span class="caret" aria-hidden="true"></span></p>
    </section>
  </main>
  <div class="coordinates" aria-hidden="true">X:<span id="x">050</span> / Y:<span id="y">050</span></div>

  <script>
    (() => {
      const root = document.documentElement;
      const canvas = document.querySelector('#matrix');
      const ctx = canvas.getContext('2d', { alpha: true });
      const xLabel = document.querySelector('#x');
      const yLabel = document.querySelector('#y');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾗﾘﾙﾚﾛﾜ0123456789<>/{}[]';
      let width = 0, height = 0, dpr = 1, font = 17, columns = 0, drops = [];
      let px = .5, py = .5, tx = .5, ty = .5, last = 0;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth;
        height = innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        font = width < 600 ? 14 : 17;
        columns = Math.ceil(width / font) + 2;
        drops = Array.from({ length: columns }, (_, i) => ({
          y: Math.random() * -height / font,
          speed: .12 + Math.random() * .2,
          alpha: .25 + Math.random() * .65,
          phase: Math.random() * Math.PI * 2,
          i
        }));
      }

      function point(clientX, clientY) {
        tx = Math.max(0, Math.min(1, clientX / width));
        ty = Math.max(0, Math.min(1, clientY / height));
        root.style.setProperty('--px', `${tx * 100}%`);
        root.style.setProperty('--py', `${ty * 100}%`);
        xLabel.textContent = String(Math.round(tx * 100)).padStart(3, '0');
        yLabel.textContent = String(Math.round(ty * 100)).padStart(3, '0');
      }

      addEventListener('pointermove', e => point(e.clientX, e.clientY), { passive: true });
      addEventListener('pointerleave', () => { tx = .5; ty = .5; });
      addEventListener('resize', resize, { passive: true });

      function frame(time) {
        requestAnimationFrame(frame);
        px += (tx - px) * .055;
        py += (ty - py) * .055;
        root.style.setProperty('--mx', (px - .5).toFixed(3));
        root.style.setProperty('--my', (py - .5).toFixed(3));

        const interval = reduced ? 110 : 58; // lluvia deliberadamente lenta
        if (time - last < interval) return;
        last = time;
        ctx.fillStyle = 'rgba(1, 8, 4, 0.12)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${font}px ui-monospace, monospace`;

        const driftX = (px - .5) * 34;
        const driftY = (py - .5) * 10;
        for (const drop of drops) {
          const wave = Math.sin(drop.y * .11 + drop.phase) * driftX;
          const x = drop.i * font + wave;
          const y = drop.y * font + driftY;
          const char = chars[(Math.random() * chars.length) | 0];
          const head = Math.random() > .975;
          ctx.fillStyle = head
            ? `rgba(205,255,220,${drop.alpha})`
            : `rgba(47,255,112,${drop.alpha * .78})`;
          ctx.shadowColor = '#26ff70';
          ctx.shadowBlur = head ? 9 : 2;
          ctx.fillText(char, x, y);
          drop.y += reduced ? drop.speed * .5 : drop.speed;
          if (y > height + font && Math.random() > .965) {
            drop.y = -2 - Math.random() * 18;
            drop.speed = .12 + Math.random() * .2;
          }
        }
        ctx.shadowBlur = 0;
      }

      resize();
      point(width / 2, height / 2);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
